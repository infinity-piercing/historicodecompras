<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste de gravação</title>
</head>
<body style="font-family:sans-serif;padding:20px">
<h2>Teste de gravação na planilha</h2>
<p>URL da API: <input id="url" style="width:100%;padding:6px" value="https://script.google.com/macros/s/AKfycbzUXRkb5_PEc3sPdkWo8nKrYVwieqauXQcy5U9wpgxpaWjWXkCUt92C4x_Z1r80oB9TAQ/exec"></p>
<button onclick="carregar()">Carregar contatos</button>
<button onclick="salvar()">Salvar teste</button>
<pre id="saida" style="background:#f4f4f4;padding:10px;margin-top:10px">—</pre>
<script>
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
function jsonp(url,cb){return new Promise(function(res,rej){
  var s=document.createElement('script'),done=false;
  var t=setTimeout(function(){cleanup();rej(new Error('timeout'));},15000);
  function cleanup(){if(done)return;done=true;clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
  window[cb]=function(d){cleanup();res(d);};
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb;
  s.onerror=function(){cleanup();rej(new Error('network'));};
  document.head.appendChild(s);
});}
function carregar(){
  var url=document.getElementById('url').value.trim();
  jsonp(url,'cb_'+Date.now()).then(function(lista){
    document.getElementById('saida').textContent='OK! '+lista.length+' registro(s) na aba Contatos:\n'+JSON.stringify(lista,null,2);
  }).catch(function(e){
    document.getElementById('saida').textContent='FALHOU: '+e.message+' — a URL não está respondendo. Confira a implantação.';
  });
}
function salvar(){
  var url=document.getElementById('url').value.trim();
  var payload={email:'teste@teste.com',nome:'Teste',telefone:'11999999999',cidade:'São Paulo',contato:true,retorno:false,data:'2026-09-01',atendente:'Andrei'};
  fetch(url,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(){document.getElementById('saida').textContent='Enviado! Clique em "Carregar contatos" para confirmar se gravou.';})
    .catch(function(e){document.getElementById('saida').textContent='FALHOU no envio: '+e.message;});
}
</script>
</body>
</html>
